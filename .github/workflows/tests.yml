name: Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/setup-uv@7e018fee7f2f085a7d0e76b2ae75727698cd887e # v10.3.0
        with:
          enable-cache: true
      - run: |
          uv sync --no-cache --quiet
          uv run playwright install --with-deps chromium
          uv run pytest tests -v
      - if: failure()
        run: |
          if [ -f tests/server.log ]; then
            echo "===== SERVER LOG ====="
            cat tests/server.log
          fi
