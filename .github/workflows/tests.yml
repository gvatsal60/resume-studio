name: Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - run: |
          uv sync --no-cache
          uv run playwright install --with-deps chromium
          uv run pytest tests -v
      - if: failure()
        run: |
          if [ -f tests/server.log ]; then
            echo "===== SERVER LOG ====="
            cat tests/server.log
          fi
