[project]
name = "rendercv-local"
version = "0.0.1"
description = "Automated local CV rendering pipeline using RenderCV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rendercv[full]>=2.8",
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude = ["tests"]

[tool.fastapi]
entrypoint = "backend.main:app"
